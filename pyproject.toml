[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "colour-palette"
version = "0.1.0"
description = "A website that finds the top 10 most common colours in an uploaded image, with NumPy."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jens Tirsvad Nielsen" }]
keywords = ["numpy", "image-processing", "colour-palette", "100-days-of-code"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=2.1,<3",
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
]

[project.scripts]
colour-palette = "colour_palette.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "UP"]
